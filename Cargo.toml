[workspace]
resolver = "3"
members = ["crates/app", "crates/shared", "crates/views"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = 'MIT'
publish = false

[workspace.dependencies]
shared = { path = "crates/shared" }
views = { path = "crates/views" }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
gpui-fps = { version = "0.9.1", features = ["gpui-fast"] }
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
