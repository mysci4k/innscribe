[workspace]
resolver = "3"
members = ["crates/app", "crates/shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = 'MIT'
publish = false

[workspace.dependencies]
shared = { path = "crates/shared" }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
gpui-fps = { version = "0.9.1", features = ["gpui-fast"] }
anyhow = "1.0.104"
