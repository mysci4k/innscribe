[package]
name = "innscribe"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
tokio = { version = "1.53.0", features = [] }
toasty = { version = "0.8.0", features = ["turso", "jiff", "serde"] }
toasty-driver-turso = "0.8.0"
uuid = { version = "1.24.0", features = ["v7"] }
jiff = "0.2.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-embed = "8.12.0"
directories = "6.0.0"
anyhow = "1.0.103"
